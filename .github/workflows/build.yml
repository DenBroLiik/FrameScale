name: Build FrameScale
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Unit tests
        run: |
          mkdir -p /tmp/framescale-tests
          javac -d /tmp/framescale-tests src/main/java/by/xopilot/framescale/FrameStats.java src/main/java/by/xopilot/framescale/CompatPolicy.java tests/FrameStatsTest.java tests/CompatPolicyTest.java src/main/java/by/xopilot/framescale/ApplyScheduler.java tests/ApplySchedulerTest.java src/main/java/by/xopilot/framescale/Resolution.java tests/ResolutionTest.java src/main/java/by/xopilot/framescale/AutoPolicy.java tests/AutoPolicyTest.java src/main/java/by/xopilot/framescale/SceneGuard.java src/main/java/by/xopilot/framescale/TrialPolicy.java src/main/java/by/xopilot/framescale/AutoPreferences.java tests/AutoSafetyTest.java src/main/java/by/xopilot/framescale/PassMetrics.java src/main/java/by/xopilot/framescale/PassSequence.java tests/PassMetricsTest.java src/main/java/by/xopilot/framescale/SamplingBudget.java src/main/java/by/xopilot/framescale/EffectSession.java tests/SamplingBudgetTest.java src/main/java/by/xopilot/framescale/SpatialPolicy.java tests/SpatialPolicyTest.java
          java -cp /tmp/framescale-tests FrameStatsTest
          java -cp /tmp/framescale-tests by.xopilot.framescale.CompatPolicyTest
          java -cp /tmp/framescale-tests by.xopilot.framescale.ApplySchedulerTest
          java -cp /tmp/framescale-tests by.xopilot.framescale.ResolutionTest
          java -cp /tmp/framescale-tests by.xopilot.framescale.AutoPolicyTest
          java -cp /tmp/framescale-tests by.xopilot.framescale.AutoSafetyTest
          java -cp /tmp/framescale-tests by.xopilot.framescale.PassMetricsTest
          java -cp /tmp/framescale-tests by.xopilot.framescale.SamplingBudgetTest
          java -cp /tmp/framescale-tests by.xopilot.framescale.SpatialPolicyTest
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Software OpenGL shader execution
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri
          LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless python3 tests/spatial_gl_check.py src/main/resources/assets/framescale/shaders/spatial.comp
      - name: Build and smoke-test native interop probe
        run: |
          sudo apt-get install -y -qq libvulkan-dev libegl-dev libgl-dev mesa-vulkan-drivers
          cc -std=c11 -O2 -Wall -Wextra -Werror native/interop-probe/probe.c -o /tmp/framescale-interop -lvulkan -lEGL -lGL
          rc=0
          EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 timeout 20s /tmp/framescale-interop || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::notice::Native GPU interop unsupported on software runner; hardware test required"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: Compile mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: FrameScale-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
