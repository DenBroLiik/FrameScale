name: Build FrameScale
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Unit tests
        run: |
          mkdir -p /tmp/framescale-tests
          javac -d /tmp/framescale-tests src/main/java/by/xopilot/framescale/FrameStats.java src/main/java/by/xopilot/framescale/CompatPolicy.java tests/FrameStatsTest.java tests/CompatPolicyTest.java
          java -cp /tmp/framescale-tests FrameStatsTest
          java -cp /tmp/framescale-tests by.xopilot.framescale.CompatPolicyTest
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Compile mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: FrameScale-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
