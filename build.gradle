plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.7.0-alpha.9'
group = 'by.xopilot'
base { archivesName = 'framescale-neoforge-1.21.1' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
neoForge {
    version = providers.gradleProperty('neo_version').get()
    runs { client { client() } }
    mods { framescale { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

repositories {
    maven {
        url = 'https://maven.caffeinemc.net/releases'
        content { includeGroup 'net.caffeinemc' }
    }
}
dependencies {
    compileOnly 'net.caffeinemc:sodium-neoforge-api:0.8.13+mc1.21.1'
}
